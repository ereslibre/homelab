[package]
name = "claude-sessions"
version = "0.1.0"
edition = "2024"
description = "Track the Claude Code sessions running in tmux and expose them over MCP"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.5", features = ["transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
